<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b5e">
<title>アンケート｜香川県高校説明会 2026</title>
<style>
:root{--navy:#173b5e;--blue:#286b9a;--ink:#1c2935;--muted:#5c6b78;--line:#dbe4eb}
*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;line-height:1.7}
header{background:var(--navy);color:white;padding:17px 22px}header a{color:white;text-decoration:none;font-size:14px}
main{max-width:720px;margin:34px auto;padding:0 18px 48px}h1{font-size:28px;color:var(--navy);margin:0 0 8px}.lead{color:var(--muted);font-size:14px;margin:0 0 22px}
form{background:white;border:1px solid var(--line);border-radius:14px;padding:22px}label{display:block;font-weight:700;margin:14px 0 6px}select,textarea{width:100%;padding:12px;border:1px solid #cbd7e0;border-radius:9px;font:inherit;background:white}textarea{resize:vertical}.btn{margin-top:18px;border:0;border-radius:9px;background:var(--navy);color:white;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}#message{font-size:14px}footer{max-width:720px;margin:0 auto;padding:0 18px 24px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header><a href="./">← 香川県高校説明会トップへ</a></header>
<main>
<h1>アンケート</h1>
<p class="lead">香川県高校説明会についてのご意見をお聞かせください。回答は今後の説明会の改善に活用します。</p>
<form id="surveyForm">
<label for="role">あなたの立場</label>
<select id="role" required><option value="">選択してください</option><option value="中学生">中学生</option><option value="保護者">保護者</option><option value="教職員">教職員</option><option value="その他">その他</option></select>
<label for="satisfaction">説明会全体の満足度</label>
<select id="satisfaction" required><option value="">選択してください</option><option value="5">5：とても満足</option><option value="4">4：満足</option><option value="3">3：普通</option><option value="2">2：やや不満</option><option value="1">1：不満</option></select>
<label for="useful">特に役立ったこと</label>
<select id="useful" required><option value="">選択してください</option><option value="高校の情報">高校の情報</option><option value="学校ごとの違い">学校ごとの違い</option><option value="進路相談">進路相談</option><option value="入試情報">入試情報</option><option value="その他">その他</option></select>
<label for="comments">感想・改善してほしいこと（任意）</label>
<textarea id="comments" rows="4" maxlength="1500" placeholder="自由に入力してください"></textarea>
<button class="btn" id="submitBtn" type="submit">アンケートを送信</button>
<p id="message" role="status" aria-live="polite"></p>
</form>
</main>
<footer>© 2026 そらのほしグループ｜香川県高校説明会</footer>
<script>
const SUPABASE_URL='https://qwrkvorbjrplpcvibxft.supabase.co';
const SUPABASE_KEY='sb_publishable_4ycP8syqbz9NT-G3aTb9LA_O4crG6HJ';
document.getElementById('surveyForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const btn=document.getElementById('submitBtn'),msg=document.getElementById('message');
 btn.disabled=true;btn.textContent='送信中…';msg.textContent='';
 const payload={role:document.getElementById('role').value,satisfaction:document.getElementById('satisfaction').value,useful:document.getElementById('useful').value,helpful:[],comments:document.getElementById('comments').value.trim()};
 try{
  const res=await fetch(SUPABASE_URL+'/rest/v1/survey_responses',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(payload)});
  if(!res.ok)throw new Error(await res.text());
  msg.textContent='ご回答ありがとうございました。回答を保存しました。';msg.style.color='#187245';e.target.reset();
 }catch(err){console.error(err);msg.textContent='送信できませんでした。設定または通信状況を確認して、もう一度お試しください。';msg.style.color='#a12626';}
 finally{btn.disabled=false;btn.textContent='アンケートを送信';}
});
</script>
</body></html>
